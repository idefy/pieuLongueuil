<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Traduction — Pieu Longueuil</title>
  <style>
    body { font-family: Lato, system-ui, sans-serif; background:#F9F6F0; color:#2A2A2A; margin:0; padding:24px; }
    .wrap { max-width:1200px; margin:0 auto; }
    h1 { font-family: 'Playfair Display', Georgia, serif; color:#1B3A6B; margin:0 0 6px; }
    .lead { color:#6B6460; margin:0 0 20px; max-width:760px; line-height:1.5; }
    button, select { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid #1B3A6B; }
    button { background:#1B3A6B; color:#fff; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
    #tt-status { margin:14px 0; min-height:1.4em; } #tt-status.ok { color:#2E6B3A; } #tt-status.err { color:#A33; }
    table { width:100%; border-collapse:collapse; background:#fff; margin-top:10px; }
    th, td { border:1px solid #E4DDD4; padding:8px; vertical-align:top; text-align:left; font-size:14px; }
    td.fr { white-space:pre-wrap; min-width:240px; } td.ctx { color:#6B6460; font-size:12px; width:110px; }
    textarea { width:100%; box-sizing:border-box; font:inherit; font-size:14px; }
    .warn { color:#9A5B00; font-size:12px; margin-top:4px; } .muted { color:#999; }
    #tt-actions { margin-top:14px; display:flex; gap:10px; }
  </style>
</head>
<body>
<div class="wrap" id="tt-app">
  <h1>Traduction automatique FR → ES / EN</h1>
  <p class="lead">Choisir une page, analyser, puis traduire : seuls les textes français <strong>sans traduction</strong> sont proposés. Relire chaque proposition avant de publier ; rien ne remplace un texte déjà traduit.</p>
  <div id="tt-login"><button id="tt-login-btn">Se connecter avec GitHub</button></div>
  <div id="tt-main" hidden>
    <select id="tt-file"></select>
    <button id="tt-analyse">Analyser</button>
  </div>
  <div id="tt-status"></div>
  <table id="tt-table">
    <thead><tr><th></th><th>Type</th><th>Français</th><th>Espagnol</th><th>Anglais</th></tr></thead>
    <tbody id="tt-rows"></tbody>
  </table>
  <div id="tt-actions" hidden>
    <button id="tt-translate">Traduire</button>
    <button id="tt-publish" hidden>Publier les traductions cochées</button>
  </div>
</div>
<script src="translate.js"></script>
</body>
</html>
