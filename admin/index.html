<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Administration — Pieu Longueuil</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"></script>
  <script>
  /* ============================================================
     DECAP CMS — Live preview for Sous-pages
     h and createClass are globals exposed by decap-cms.js
  ============================================================ */

  CMS.registerPreviewStyle('../css/main.css');
  CMS.registerPreviewStyle(`
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@400;700&display=swap');
    body { font-family:'Lato',sans-serif; background:#F9F6F0; margin:0; padding:0; color:#2A2A2A; }
    .preview-hero { background:#1B3A6B; padding:40px 48px 44px; position:relative; overflow:hidden; min-height:160px; }
    .preview-hero.has-image { background-size:cover; background-position:center; }
    .preview-hero.has-image::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom,rgba(13,31,60,0.3),rgba(13,31,60,0.85)); }
    .preview-inner { position:relative; z-index:1; }
    .preview-back { font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:16px; }
    .preview-rule { width:40px; height:1px; background:#B8924A; margin:14px 0; }
    .preview-title { font-family:'Playfair Display',Georgia,serif; font-size:36px; font-weight:700; color:#fff; line-height:1.1; margin:0 0 8px; }
    .preview-subtitle { font-family:'Playfair Display',Georgia,serif; font-size:17px; font-style:italic; color:rgba(255,255,255,0.7); margin:0; }
    .preview-body { max-width:720px; margin:0 auto; padding:48px; }
    .sp-intro { font-family:'Playfair Display',Georgia,serif; font-size:17px; font-style:italic; color:#6B6460; line-height:1.8; margin-bottom:32px; }
    .sp-heading { font-family:'Playfair Display',Georgia,serif; font-size:26px; font-weight:700; color:#0D1F3C; margin:36px 0 14px; padding-bottom:10px; border-bottom:1px solid #E4DDD4; }
    .sp-subheading { font-family:'Playfair Display',Georgia,serif; font-size:19px; font-weight:600; color:#1B3A6B; margin:24px 0 10px; }
    .sp-eyebrow { font-size:10px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:#B8924A; margin-bottom:6px; }
    .sp-body { font-size:15px; line-height:1.85; color:#2A2A2A; margin-bottom:14px; }
    .sp-note { font-size:13px; font-style:italic; color:#6B6460; margin-bottom:14px; padding-left:14px; border-left:2px solid #E4DDD4; }
    .sp-callout { background:#EAF0F9; border-left:3px solid #B8924A; border-radius:0 6px 6px 0; padding:16px 20px; margin:20px 0; font-size:14px; line-height:1.7; }
    .sp-divider { border:none; border-top:1px solid #E4DDD4; margin:28px 0; }
    .sp-image { width:100%; border-radius:6px; margin:20px 0; display:block; }
    .sp-list { list-style:none; margin-bottom:16px; padding:0; }
    .sp-list li { font-size:14px; line-height:1.65; display:flex; gap:10px; align-items:flex-start; padding:4px 0; }
    .sp-list li::before { content:'—'; color:#B8924A; font-weight:700; flex-shrink:0; }
    .sp-linklist { list-style:none; padding:0; margin-bottom:16px; }
    .sp-linklist li { margin-bottom:6px; }
    .sp-linklist li a { font-size:13px; font-weight:700; color:#2C5F9E; display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid #E4DDD4; border-radius:4px; background:#fff; text-decoration:none; }
    .sp-cta { display:inline-flex; align-items:center; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:10px 22px; border-radius:3px; border:1px solid #E4DDD4; background:#fff; color:#1B3A6B; margin:20px 0; text-decoration:none; }
    .sp-cta.gold { background:#B8924A; color:#fff; border-color:#B8924A; }
    .preview-empty { text-align:center; padding:48px 24px; color:#6B6460; font-style:italic; font-size:14px; }
  `, { raw: true });

  /* ── Safe field getter ──────────────────────────────────── */
  function gf(entry, field) {
    try { return entry.getIn(['data', field]) || ''; }
    catch(e) { return ''; }
  }

  /* ── Inline markdown → HTML ─────────────────────────────── */
  function md(text) {
    if (!text) return '';
    return String(text)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g,     '<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  }

  /* ── Render one section ─────────────────────────────────── */
  function renderSection(s, i) {
    if (!s || !s.get) return null;
    var type = s.get('type') || '';
    var txt  = s.get('text_fr') || '';
    var key  = i;

    switch(type) {
      case 'eyebrow':
        return h('div', { key: key, className: 'sp-eyebrow' }, txt);

      case 'intro':
        return h('p', { key: key, className: 'sp-intro',
          dangerouslySetInnerHTML: { __html: md(txt) } });

      case 'heading':
        return h('h2', { key: key, className: 'sp-heading' }, txt);

      case 'subheading':
        return h('h3', { key: key, className: 'sp-subheading' }, txt);

      case 'body':
        return h('p', { key: key, className: 'sp-body',
          dangerouslySetInnerHTML: { __html: md(txt) } });

      case 'note':
        return h('p', { key: key, className: 'sp-note',
          dangerouslySetInnerHTML: { __html: md(txt) } });

      case 'callout':
        return h('div', { key: key, className: 'sp-callout',
          dangerouslySetInnerHTML: { __html: md(txt) } });

      case 'divider':
        return h('hr', { key: key, className: 'sp-divider' });

      case 'image': {
        var src = s.get('src_fr') || s.get('src') || '';
        var alt = s.get('alt_fr') || '';
        var cap = s.get('caption_fr') || '';
        if (!src) return null;
        return h('figure', { key: key, style: { margin: '20px 0' } },
          h('img', { className: 'sp-image', src: src, alt: alt }),
          cap ? h('figcaption', {
            style: { fontSize:'13px', color:'#6B6460', textAlign:'center', marginTop:'6px', fontStyle:'italic' }
          }, cap) : null
        );
      }

      case 'list': {
        var items = s.get('items');
        if (!items || !items.size) return null;
        return h('ul', { key: key, className: 'sp-list' },
          items.map(function(item, j) {
            return h('li', { key: j }, item.get('text_fr') || '');
          }).toArray()
        );
      }

      case 'linklist': {
        var links = s.get('items');
        if (!links || !links.size) return null;
        return h('ul', { key: key, className: 'sp-linklist' },
          links.map(function(item, j) {
            var label = item.get('label_fr') || '';
            var url   = item.get('url_fr') || item.get('url') || '#';
            return h('li', { key: j },
              h('a', { href: url }, '↗ ' + label)
            );
          }).toArray()
        );
      }

      case 'cta': {
        var clabel = s.get('label_fr') || '';
        var cstyle = s.get('style') || 'primary';
        var ccls   = 'sp-cta' + (cstyle === 'gold' ? ' gold' : '');
        return h('div', { key: key, style: { margin: '20px 0' } },
          h('span', { className: ccls }, clabel)
        );
      }

      case 'page_link': {
        var plabel = s.get('label_fr') || '';
        return h('div', { key: key, style: { margin: '20px 0' } },
          h('span', { className: 'sp-cta' }, plabel + ' →')
        );
      }

      default:
        return null;
    }
  }

  /* ── Preview component — uses global h and createClass ─── */
  var SubpagePreview = createClass({
    render: function() {
      var entry    = this.props.entry;
      var getAsset = this.props.getAsset;

      var title    = gf(entry, 'title_fr')    || '(Titre non défini)';
      var subtitle = gf(entry, 'subtitle_fr') || '';
      var heroRaw  = gf(entry, 'hero_image_fr') || gf(entry, 'hero_image') || '';
      var heroImg  = heroRaw ? getAsset(heroRaw).toString() : '';
      var sections = entry.getIn(['data', 'sections']);

      var heroClass = 'preview-hero' + (heroImg ? ' has-image' : '');
      var heroStyle = heroImg ? { backgroundImage: 'url(' + heroImg + ')' } : {};

      return h('div', {},
        h('div', { className: heroClass, style: heroStyle },
          h('div', { className: 'preview-inner' },
            h('div', { className: 'preview-back' }, '← Retour à l\'accueil'),
            h('div', { className: 'preview-rule' }),
            h('h1', { className: 'preview-title' }, title),
            subtitle ? h('p', { className: 'preview-subtitle' }, subtitle) : null
          )
        ),
        h('div', { className: 'preview-body' },
          sections && sections.size > 0
            ? sections.map(function(s, i) {
                return renderSection(s, i);
              }).toArray()
            : h('p', { className: 'preview-empty' },
                'Ajoutez des sections pour voir un aperçu…'
              )
        )
      );
    }
  });

  CMS.registerPreviewTemplate('pages', SubpagePreview);
  </script>
</body>
</html>
