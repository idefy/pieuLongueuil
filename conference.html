<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Conférence de Pieu — Pieu Longueuil</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { background: var(--c-light); }
    .conf-header {
      background: var(--c-primary);
      padding: 48px 40px 40px;
      text-align: center;
    }
    .conf-header-eyebrow {
      font-family: var(--font-body);
      font-size: 11px; font-weight: 500;
      color: var(--c-secondary);
      letter-spacing: 0.2em; text-transform: uppercase;
      margin-bottom: 12px;
    }
    .conf-header-title {
      font-family: var(--font-display);
      font-size: 40px; font-weight: 700;
      color: #fff; margin-bottom: 8px;
    }
    .conf-header-date {
      font-family: var(--font-body);
      font-size: 14px; color: rgba(255,255,255,0.65);
    }
    .conf-gold-bar { height: 3px; background: var(--c-secondary); }
    .conf-body { max-width: 720px; margin: 0 auto; padding: 56px 40px; }
    .conf-section { margin-bottom: 48px; }
    .conf-section-title {
      font-family: var(--font-display);
      font-size: 26px; font-weight: 700;
      color: var(--c-dark); margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--c-border);
    }
    .conf-item {
      display: flex; gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--c-border);
    }
    .conf-item:last-child { border-bottom: none; }
    .conf-time {
      font-family: var(--font-body);
      font-size: 12px; font-weight: 700;
      color: var(--c-secondary);
      min-width: 60px; padding-top: 2px;
    }
    .conf-item-title {
      font-family: var(--font-body);
      font-size: 15px; font-weight: 500;
      color: var(--c-dark); margin-bottom: 2px;
    }
    .conf-item-detail {
      font-family: var(--font-body);
      font-size: 13px; color: var(--c-muted);
    }
    .conf-item-hymn {
      font-family: var(--font-display);
      font-size: 14px; color: var(--c-muted);
      font-style: italic;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-body); font-size: 13px;
      color: var(--c-muted); margin-bottom: 40px;
      transition: color 0.2s; text-decoration: none;
    }
    .back-link:hover { color: var(--c-primary); }
    .conf-loading {
      text-align: center; padding: 60px 20px;
      font-family: var(--font-body); font-size: 14px;
      color: var(--c-muted); font-style: italic;
    }
    @media (max-width: 600px) {
      .conf-body { padding: 32px 20px; }
      .conf-header { padding: 40px 20px 32px; }
      .conf-header-title { font-size: 28px; }
    }
  </style>
</head>
<body>

<div class="conf-header">
  <p class="conf-header-eyebrow" id="conf-eyebrow">Pieu Longueuil Québec</p>
  <h1 class="conf-header-title" id="conf-title">Conférence de Pieu</h1>
  <p class="conf-header-date" id="conf-date"></p>
</div>
<div class="conf-gold-bar"></div>

<div class="conf-body">
  <a class="back-link" href="index.html">← Retour au site</a>
  <div id="conf-content">
    <p class="conf-loading">Chargement du programme…</p>
  </div>
</div>

<script src="js/config.js"></script>
<script>
(async function() {
  const lang = localStorage.getItem('pieu-lang') || 'fr';

  /* ── Type icons/labels ─────────────────────────────────── */
  const typeLabels = {
    hymn:   { fr: '♪', es: '♪', en: '♪' },
    prayer: { fr: '', es: '', en: '' },
    talk:   { fr: '', es: '', en: '' },
    music:  { fr: '', es: '', en: '' },
    item:   { fr: '', es: '', en: '' },
  };

  /* ── Load data/conference.json ──────────────────────────── */
  let data;
  try {
    const res = await fetch('data/conference.json');
    if (!res.ok) throw new Error('not found');
    data = await res.json();
  } catch(e) {
    document.getElementById('conf-content').innerHTML =
      `<p class="conf-loading">Programme non disponible pour le moment.</p>`;
    return;
  }

  /* ── Header ─────────────────────────────────────────────── */
  const title = data[`title_${lang}`] || data.title_fr || 'Conférence de Pieu';
  document.getElementById('conf-title').textContent = title;
  document.title = title + ' — Pieu Longueuil';

  if (data.date) {
    try {
      const d = new Date(data.date + 'T12:00:00'); // avoid timezone shift
      document.getElementById('conf-date').textContent =
        d.toLocaleDateString(lang === 'fr' ? 'fr-CA' : lang === 'es' ? 'es-MX' : 'en-CA',
          { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    } catch(e) {
      document.getElementById('conf-date').textContent = data.date;
    }
  }

  /* ── Sessions ───────────────────────────────────────────── */
  const sessions = data.sessions || [];
  if (!sessions.length) {
    document.getElementById('conf-content').innerHTML =
      `<p class="conf-loading">Aucun programme disponible pour cette conférence.</p>`;
    return;
  }

  const html = sessions.map(session => {
    const sessionTitle = session[`title_${lang}`] || session.title_fr || '';
    const items = session.items || [];

    const itemsHtml = items.map(item => {
      const itemTitle  = item[`title_${lang}`]  || item.title_fr  || '';
      const itemDetail = item[`detail_${lang}`] || item.detail_fr || '';
      const isHymn = item.type === 'hymn';

      return `
        <div class="conf-item">
          <div class="conf-time">${item.time || ''}</div>
          <div class="conf-item-content">
            <div class="conf-item-title">${itemTitle}</div>
            ${itemDetail
              ? isHymn
                ? `<div class="conf-item-hymn">${itemDetail}</div>`
                : `<div class="conf-item-detail">${itemDetail}</div>`
              : ''}
          </div>
        </div>`;
    }).join('');

    return `
      <div class="conf-section">
        <h2 class="conf-section-title">${sessionTitle}</h2>
        ${itemsHtml}
      </div>`;
  }).join('');

  document.getElementById('conf-content').innerHTML = html;
})();
</script>
</body>
</html>
